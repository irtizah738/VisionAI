name: VisionAI CI — Lint, Typecheck & Firestore Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-audit:
    name: Build, Lint & Zero-Trust Rules Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Static Analysis
        run: npm run lint

      - name: Run TypeScript Compiler Check
        run: npx tsc --noEmit

      - name: Audit Zero-Trust Firestore Security Rules
        run: |
          test -f firestore.rules
          test -f firebase-blueprint.json
          grep -q "allow read, write: if false;" firestore.rules
          grep -q "isValidSocialPost" firestore.rules
          grep -q "isValidBrandVoice" firestore.rules

      - name: Verify Next.js Standalone Production Build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build